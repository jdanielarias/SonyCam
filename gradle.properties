org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Deshabilitada, pero que quede claro qué es y qué no es esto.
#
# kotlin-gradle-plugin 2.0.20 está afectado por CVE-2026-53914
# (GHSA-r937-wjx7-w2jp, CVSS 6.7): deserialización insegura de metadatos de
# caché de compilación, con ejecución de código posible. Vector local y
# privilegios altos; es riesgo de la máquina que compila, no del APK.
#
# Apagar la caché de Gradle **no es la corrección**: la deserialización
# vulnerable es de Kotlin, no del mecanismo de caché de Gradle. Reduce
# superficie y no cuesta nada, nada más.
#
# La corrección real es **Kotlin 2.4.20 o superior**, y a fecha de hoy
# (2026-08-29) esa versión **no ha salido estable**: lo publicado es
# 2.4.20-Beta1, del 24 de junio de 2026. Así que no hay una versión estable a la
# que actualizar todavía, y decir "está pendiente actualizar" sería sugerir que
# basta con querer.
#
# Mientras tanto, que es lo único que de verdad protege: **compilar sólo con
# cachés y artefactos de confianza**. El vector exige que alguien meta metadatos
# manipulados en la caché de compilación; sin caché compartida no hay por dónde.
org.gradle.caching=false
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
